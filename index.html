ue entre manos propias y ajenas.»`,"talentos.mano_verde.efecto.1":`+10 % de comida en todos los campos.`,"talentos.mano_verde.lore.2":`«El invierno también escucha, si se le habla con respeto.»`,"talentos.mano_verde.efecto.2":`El invierno rinde ×0,75 de la comida en vez de ×0,5.`,"talentos.mano_verde.lore.3":`«Lo que nace en tu valle ya sabe por dónde empieza el surco.»`,"talentos.mano_verde.efecto.3":`Cada habitante que nace trae «Siembra rápida»: +25 % en el campo.`,"talentos.mano_verde.lore.4":`«De una misma raíz salen dos caminos, y un árbol no sigue ambos.»`,"talentos.mano_verde.efecto.4":`A elegir: +0,02 PE al día por campesino, o +10 % a toda clase de vida.`,"talentos.mano_verde.lore.5":`«El primer hogar aprende a ser más grande de lo que fue.»`,"talentos.mano_verde.efecto.5":`La cuna sube un subnivel.`,"talentos.mano_verde.lore.6":`«Cada otoño la tierra devuelve más de lo que recibió.»`,"talentos.mano_verde.efecto.6":`Cada otoño, tras la cosecha, el valle sube un subnivel para siempre y puede pasar el límite de rango de la tierra.`,"talentos.mano_verde.lore.7":`«El Dao de la cosecha no se cuenta en granos, sino en estaciones.»`,"talentos.mano_verde.efecto.7":`«Tierra del Dao»: el valle sube un rango y la comida que no cabe se vuelve Qi, 1 por cada 10.`,"talentos.ojo.lore.4":`«Lo que cae del cielo pertenece a quien mira hacia arriba.»`,"talentos.ojo.efecto.4":`+25 % de botín, en recursos y en probabilidad de objeto.`,"talentos.ojo.lore.5":`«Todo hallazgo guarda un hermano mayor.»`,"talentos.ojo.efecto.5":`Cada objeto tiene un 25 % de subir un rango.`,"talentos.ojo.lore.6":`«Ningún vacío sobrevive a una mirada atenta.»`,"talentos.ojo.efecto.6":`Ninguna tirada sale vacía.`,"talentos.ojo.lore.7":`«La marea trae a cada cuerpo lo suyo, y a ti, algo más.»`,"talentos.ojo.efecto.7":`El botín sube un rango y cada marea da una tirada más.`,"talentos.vinculo.lore.5":`«Un nombre dicho con intención ata más que una cadena.»`,"talentos.vinculo.efecto.5":`Se vincula con los 5 súbditos de más potencial: cada punto (Hierro 1, Bronce 2, Plata 3) da +0,8 % de Qi y +1 de defensa.`,"talentos.vinculo.lore.6":`«Lo que un héroe sabe, otro puede recordarlo.»`,"talentos.vinculo.efecto.6":`Hereda el potencial y el talento de los 3 héroes de más potencial.`,"talentos.vinculo.lore.7":`«Cuando todos recuerdan lo mismo, el recuerdo se vuelve ley.»`,"talentos.vinculo.efecto.7":`Los vinculados comparten sus talentos: hereda de los 5 héroes de más potencial, cada uno una sola vez.`,"artefactos.caldero.nombre":`Caldero`,"artefactos.estandarte.nombre":`Estandarte`,"artefactos.pagoda.nombre":`Pagoda`,"artefactos.caldero.lore":`«Lo que hierve a fuego lento se vuelve más de lo que era.»`,"artefactos.caldero.efecto":`Cada ranura repite una receta cada 10 días: píldora de Qi, piedra de reunión y, desde Bronce, arma.`,"artefactos.estandarte.lore":`«Un trapo en lo alto es una promesa que mil pies aprenden a seguir.»`,"artefactos.estandarte.efecto":`Escuadras de 5 tropas que ganan méritos en cada marea o cacería y ascienden a guardia, cazadores o lanceros.`,"artefactos.pagoda.lore":`«Cada piso guarda un silencio distinto. Algunos respiran.»`,"artefactos.pagoda.efecto":`Tras ganar una cacería puedes capturar la bestia en vez de llevarte el botín, y te da PE, madera o piedra al día.`,"heroes.dialogo.primera_marea":`«Vi cómo la marea se rompía contra su empalizada. Pocos valles resisten la primera. Quise saber quién los manda.»`,"heroes.dialogo.treinta_familias":`«Treinta humos suben de este valle. Donde hay tanto fuego, siempre hace falta quien lo defienda.»`,"heroes.dialogo.villa":`«Ya no es una aldea. Las montañas lo saben, y los que bajan de ellas también.»`,"heroes.dialogo.fundacion":`«Llevas la Fundación en el pecho. Los viejos dicen que, desde ahí, el Sistema pide más de lo que da.»`,"heroes.dialogo.valle_prospera":`«Se habla de este valle más allá del paso. Dicen que aquí la tierra no se agota.»`,"heroes.dialogo.llamada":`«Me llamaron, y vine. Quien responde a una llamada suele quedarse hasta que la deuda se paga.»`,"ui.heroe.causa.primera_marea":`Llega porque el valle resistió la primera marea.`,"ui.heroe.causa.treinta_familias":`Llega porque el valle ya reúne treinta familias.`,"ui.heroe.causa.villa":`Llega porque el valle se alzó como Villa.`,"ui.heroe.causa.fundacion":`Llega porque el Señor alcanzó la Fundación.`,"ui.heroe.causa.valle_prospera":`Llega porque el valle prosperó.`,"ui.heroe.causa.llamada":`Llega porque lo invocaste en el Altar.`,"misiones.primer_aliento.titulo":`Primer aliento del Dao`,"misiones.rugidos.titulo":`Rugidos en el bosque`,"misiones.primera_marea.titulo":`La primera marea`,"misiones.treinta_familias.titulo":`Treinta familias`,"misiones.novena_capa.titulo":`Novena capa`,"misiones.fundacion.titulo":`Fundación del Dao`,"misiones.valle_prospera.titulo":`El valle prospera`,"misiones.cumbre.titulo":`Cumbre de la Fundación`,"misiones.nucleo.titulo":`Núcleo Dorado`,"misiones.familias.titulo":`Familias nuevas`,"misiones.veta.titulo":`El latido de la veta`,"misiones.muro.titulo":`Muro de troncos`,"misiones.desafio_capa.titulo":`Desafío: la siguiente capa`,"misiones.graneros.titulo":`Graneros llenos`,"misiones.desafio_marea.titulo":`Desafío: la marea`,"consejos.cultivo.texto":`【Sistema】El Qi se acumula solo. Las piedras espirituales lo aceleran.`,"consejos.vivienda.texto":`【Sistema】No queda techo libre. Sin chozas, el valle no crece.`,"consejos.veta.texto":`【Sistema】Bajo el valle duerme una veta. Un pozo espiritual extrae sus piedras.`,"consejos.camara.texto":`【Sistema】Una cámara de meditación multiplica el Qi y ayuda en los grandes avances.`,"consejos.pozos.texto":`【Sistema】Las cámaras multiplican el Qi, no lo crean. Sin piedras espirituales, no hay nada que multiplicar.`,"consejos.invierno.texto":`【Sistema】En invierno, la cosecha cae a la mitad. Lo que no se guarde, faltará.`,"consejos.almacen.texto":`【Sistema】El almacén está casi lleno. Lo que no quepa se perderá.`,"consejos.defensa.texto":`【Sistema】La defensa suma milicia, empalizadas, tropas y el Poder del anfitrión.`,"consejos.castigo.texto":`【Sistema】Esta misión trae castigo. Rechazarla no cuesta nada.`,"consejos.gran_avance.texto":`【Sistema】Un gran avance puede fallar. Las cámaras y las píldoras suben la probabilidad.`,"explicaciones.clases.texto":`Aquí se forman los aldeanos. El que no tiene clase trabaja en cualquier puesto, pero rinde menos. Formarlo cuesta comida y días, y pide un Taller para los oficios o un Campo de entrenamiento para las tropas; después rinde más en lo suyo. Subir a Bronce cuesta además piedras espirituales, y solo algunos tienen el potencial.`,"explicaciones.heroes.texto":`Llegó un héroe. No le quita trabajo a nadie. Elige su tarea: gobernar un edificio para que rinda más, acompañar al anfitrión para darle Qi o liderar las tropas contra las mareas. Sin tarea, solo cuentan algunos de sus talentos y habilidades.`,"explicaciones.altar.texto":`El Altar llama a gente nueva. Cada invocación cuesta recursos y pide una vivienda libre. Puede salir un aldeano, una tropa o, con suerte, un héroe. Una ficha de llamada paga la invocación, pero la vivienda sigue haciendo falta.`,"eventos.anciano.titulo":`El anciano harapiento`,"eventos.anciano.acoger":`Darle comida y techo (−20 comida)`,"eventos.anciano.echar":`Echarlo`,"eventos.tributo_mu.titulo":`Mu Tianhao exige tributo`,"eventos.tributo_mu.pagar":`Pagar el tributo (−50 madera)`,"eventos.tributo_mu.negarse":`Negarse (Poder 8+)`,"eventos.revancha.titulo":`La revancha`,"eventos.revancha.abofetear":`Abofetearlo`,"eventos.revancha.perdonar":`Perdonarlo`,"eventos.refugiados.titulo":`Refugiados del norte`,"eventos.refugiados.todos":`Acoger a todos (−40 comida)`,"eventos.refugiados.fuertes":`Acoger solo a los fuertes`,"eventos.refugiados.cerrar":`Cerrar las puertas`,"eventos.caravana.titulo":`Caravana de los Cuatro Mares`,"eventos.caravana.madera":`Cambiar madera (−50 madera, +25 piedra)`,"eventos.caravana.comida":`Cambiar comida (−60 comida, +5 PE)`,"eventos.caravana.nada":`Despedir a la caravana`,"eventos.lluvia_qi.titulo":`Lluvia de Qi`,"eventos.lluvia_qi.meditar":`Meditar`,"eventos.lluvia_qi.trabajar":`Seguir trabajando`,"eventos.langostas.titulo":`Langostas`,"eventos.langostas.quemar":`Quemar un campo (−1 campo)`,"eventos.langostas.rezar":`Rezar`,"eventos.invierno_crudo.titulo":`Invierno crudo`,"eventos.invierno_crudo.repartir":`Repartir leña (−30 madera)`,"eventos.invierno_crudo.nada":`Esperar a que pase`,"eventos.lobo_herido.titulo":`Lobo espiritual herido`,"eventos.lobo_herido.cazar":`Cazarlo (Poder 10+)`,"eventos.lobo_herido.curar":`Curarlo (−10 comida)`,"eventos.veta_superficial.titulo":`Veta superficial`,"eventos.veta_superficial.deprisa":`Excavar deprisa`,"eventos.veta_superficial.cuidado":`Excavar con cuidado`,"eventos.ladron.titulo":`El ladrón de la madre enferma`,"eventos.ladron.perdonar":`Perdonarlo (−10 comida)`,"eventos.ladron.castigar":`Castigarlo`,"eventos.pergamino.titulo":`Pergamino en las ruinas`,"eventos.pergamino.estudiar":`Estudiarlo`,"eventos.pergamino.vender":`Venderlo a la caravana`,"eventos.discipulo_espada.titulo":`Discípulo herido de la Espada Celeste`,"eventos.discipulo_espada.socorrer":`Socorrerlo (−20 comida)`,"eventos.discipulo_espada.robar":`Robarle la bolsa`,"eventos.veta_habla.titulo":`La veta habla`,"eventos.veta_habla.escuchar":`Escuchar la voz`,"eventos.veta_habla.sellar":`Sellar el sueño`,"eventos.sistema_falla.titulo":`El Sistema falla`,"eventos.sistema_falla.continuar":`Continuar`,"errores.sinRecursos":`No alcanzan los recursos. Espera a reunirlos o produce más.`,"errores.excedeTope":`Ese costo supera el tope del almacén. Amplía el almacén para poder pagarlo.`,"errores.sinPuestos":`No quedan puestos libres en ese oficio. Construye edificios que los abran.`,"errores.sinTrabajadores":`No quedan habitantes sin ocupar. Libera a alguien de otro oficio.`,"errores.sinPlano":`Falta el plano de este edificio. Búscalo en el botín de las cacerías.`,"errores.requisito":`No se ue crees poder. Si el plazo se agota sin que subas de capa, tu cuerpo lo pagará con una lesión.`,"misiones.graneros.contexto":`Un mal invierno vacía hasta los mejores almacenes. Mejor llenarlos antes de que la nieve decida.`,"misiones.desafio_marea.contexto":`El Sistema apuesta a que resistirás la próxima marea. Si el valle cae, se llevará parte de lo que guardas.`,"ui.misiones.historial":`Historial`,"ui.misiones.historialVacio":`Aún no has cerrado ninguna misión.`,"ui.misiones.historialFila":`{resultado} · {fecha}`,"ui.misiones.resultado.cumplida":`Cumplida`,"ui.misiones.resultado.fallida":`Fallida`,"ui.misiones.resultado.retirada":`Retirada`,"ui.misiones.resultado.rechazada":`Rechazada`,"ui.talentos.fichaVer":`Ver ficha`,"ui.talentos.fichaVerNombre":`Ver ficha de {talento}`,"ui.talentos.fichaOcultar":`Ocultar ficha`,"ui.talentos.fichaOcultarNombre":`Ocultar ficha de {talento}`,"ui.talentos.fichaNombre":`Ficha de {talento}`,"ui.talentos.fichaNace":`Nace en el grado {grado}`,"ui.talentos.fichaAhora":`Grado actual: {grado}`,"ui.talentos.fichaGrados":`Grados`,"ui.talentos.fichaActual":`Actual`,"ui.talentos.fichaSiguiente":`Siguiente`,"ui.talentos.fichaBifurcacion":`Bifurcación en el grado {grado}`,"ui.talentos.fichaBifFutura":`Se elige al llegar a ese grado. Solo una rama se queda.`,"ui.talentos.fichaBifPendiente":`Aún no has elegido: el Sistema te lo pedirá.`,"ui.talentos.fichaElegida":`Elegida`,"ui.guia.nombre":`El Sistema`,"ui.guia.quien":`EL SISTEMA`,"ui.guia.paso":`Paso {n} de {m}`,"ui.guia.saltar":`Saltar guía`,"ui.guia.entendido":`Entendido`,"ui.seccion.codice":`Códice`,"ui.codice.ayuda":`Lo que el Sistema sabe del valle, para consultarlo cuando quieras.`,"ui.codice.pestanas":`Apartados del Códice`,"ui.codice.tab.recursos":`Recursos`,"ui.codice.tab.edificios":`Edificios`,"ui.codice.tab.talentos":`Talentos`,"ui.codice.tab.mareas":`Mareas`,"ui.codice.origen":`De dónde sale`,"ui.codice.uso":`Para qué sirve`,"ui.codice.tope":`Tope actual`,"ui.codice.recurso.comida.origen":`Sobre todo la cultivan los campesinos en los campos: {tasa} al día cada uno, de base y según la estación. Quien no tiene trabajo aporta {ocioso} al día.`,"ui.codice.recurso.comida.uso":`Cada habitante come {consumo} al día. Con comida y vivienda libre, la gente crece; si falta, llega el hambre.`,"ui.codice.recurso.madera.origen":`Sobre todo la cortan los leñadores en la leñería: {tasa} al día cada uno, de base. También llega de otras fuentes, como las bestias de carga de la Pagoda y las recompensas de misiones.`,"ui.codice.recurso.madera.uso":`Sobre todo se gasta en construir edificios, y también en las armas del Caldero.`,"ui.codice.recurso.piedra.origen":`Sobre todo la sacan los canteros en la cantera: {tasa} al día cada uno, de base. También llega de otras fuentes, como las bestias de carga de la Pagoda y las recompensas de misiones.`,"ui.codice.recurso.piedra.uso":`Sobre todo se gasta en construir edificios, y también en el señorío: la reunión y las armas del Caldero.`,"ui.codice.recurso.pe.origen":`Sobre todo la sacan los mineros en el pozo espiritual: {tasa} al día cada uno, de base. También llega de otras fuentes, como las mareas vencidas, las cacerías, las misiones y el campo de hierbas espirituales.`,"ui.codice.recurso.pe.uso":`El Señor las absorbe para ganar Qi y avanzar en su cultivo. También se gastan en algunas obras y al formar o llamar gente.`,"ui.codice.costo":`Costo base`,"ui.codice.factor":`Cada copia más cuesta {factor} % de la anterior.`,"ui.codice.genera":`Genera {recurso} con el trabajo de su gente.`,"ui.codice.puestos":`{n} puestos de {oficio}`,"ui.codice.puestosUno":`1 puesto de {oficio}`,"ui.codice.edificio.plano":`Hace falta su plano: sale en el botín.`,"ui.codice.edificio.maximo":`Máximo: {n}.`,"ui.codice.edificio.unica":`Solo puede haber uno.`,"ui.codice.edificio.requisitos":`Pide {poblacion} habitantes y que el valle esté en el subnivel {subnivel}.`,"ui.codice.edificio.dias":`Tarda {n} días en terminarse.`,"ui.codice.talentos.ayuda":`Todos los talentos del juego, también los que aún no tienes.`,"ui.codice.talento.tienes":`Lo tienes, en el grado {grado}`,"ui.codice.talento.nace":`Aún no lo tienes. Nace en el grado {grado}`,"ui.codice.marea.intervalo":`Una marea de bestias llega cada {n} días.`,"ui.codice.marea.aviso":`El Sistema avisa {n} días antes, con tu probabilidad de victoria.`,"ui.codice.marea.proxima":`Próxima marea`,"ui.codice.marea.titulo":`Fuerza y defensa`,"ui.codice.marea.fuerza":`La fuerza de la marea sube a {g} % de la anterior cada vez que vences una. La primera tiene {f0}.`,"ui.codice.marea.defensa":`No hay victoria segura: cuanto más alta es tu defensa frente a la fuerza de la marea, más probable es vencer. La primera marea del tutorial es la excepción: queda protegida si tu defensa alcanza la que pide su misión.`,"ui.codice.marea.suma":`Suman a tu defensa: la base ({base}), cada habitante que no es tropa ni héroe ({milicia}), las empalizadas, las tropas, los héroes, el poder de la etapa del Señor, las bestias de la Pagoda y otros efectos.`,"ui.codice.marea.pierdes":`Si pierdes`,"ui.codice.marea.pierdeRecursos":`Pierdes {pct} de la comida, la madera y la piedra.`,"ui.codice.marea.pierdeGente":`Muere {pct} de tu gente, al menos 1 habitante.`,"ui.codice.marea.pierdeHerida":`El Señor sufre una lesión de {n} días: mientras dure, su Qi se reduce a la mitad.`,"ui.codice.marea.pierdeEdificioUno":`Se arrasa 1 edificio productivo al azar: campo, leñería, cantera, pozo o cámara. Nunca el último campo ni la última leñería.`,"ui.codice.marea.pierdeEdificios":`Se arrasan {n} edificios productivos al azar: campo, leñería, cantera, pozo o cámara. Nunca el último campo ni la última leñería.`,"ui.codice.marea.pierdeEmpalizada":`Si tienes empalizadas, pierdes una.`,"ui.codice.marea.cae":`Si solo queda un habitante, el feudo cae.`};function uu(e){let t=Object.values(e).filter(e=>typeof e==`number`);return Object.entries(e).filter(([e,n])=>t.indexOf(+e)===-1).map(([e,t])=>t)}function du(e,t=`
