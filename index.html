lizada.nombre":`Empalizada`,"edificios.pozo.nombre":`Pozo espiritual`,"edificios.camara.nombre":`Cámara de meditación`,"edificios.taller.nombre":`Taller`,"edificios.entrenamiento.nombre":`Campo de entrenamiento`,"edificios.torre.nombre":`Torre de flechas`,"edificios.hierbas.nombre":`Campo de hierbas espirituales`,"edificios.formacion.nombre":`Formación de reunión de Qi`,"edificios.villa.nombre":`Villa`,"etapas.mortal.nombre":`Mortal`,"etapas.refinamiento_1.nombre":`Refinamiento de Qi, capa 1`,"etapas.refinamiento_2.nombre":`Refinamiento de Qi, capa 2`,"etapas.refinamiento_3.nombre":`Refinamiento de Qi, capa 3`,"etapas.refinamiento_4.nombre":`Refinamiento de Qi, capa 4`,"etapas.refinamiento_5.nombre":`Refinamiento de Qi, capa 5`,"etapas.refinamiento_6.nombre":`Refinamiento de Qi, capa 6`,"etapas.refinamiento_7.nombre":`Refinamiento de Qi, capa 7`,"etapas.refinamiento_8.nombre":`Refinamiento de Qi, capa 8`,"etapas.refinamiento_9.nombre":`Refinamiento de Qi, capa 9`,"etapas.fundacion_inicial.nombre":`Fundación inicial`,"etapas.fundacion_media.nombre":`Fundación media`,"etapas.fundacion_tardia.nombre":`Fundación tardía`,"etapas.fundacion_cumbre.nombre":`Fundación cumbre`,"etapas.nucleo_dorado.nombre":`Núcleo Dorado`,"talentos.mano_verde.nombre":`Mano verde`,"talentos.ojo.nombre":`Ojo del saqueo`,"talentos.vinculo.nombre":`Vínculo de vasallos`,"talentos.mano_verde.rama.pe":`Rama de piedras: cada campesino aporta piedras espirituales al día`,"talentos.mano_verde.rama.artesano":`Rama del artesano: sube un 10 % lo que producen todos los oficios`,"talentos.mano_verde.lore.0":`«La tierra recuerda a quien la trata con paciencia.»`,"talentos.mano_verde.efecto.0":`+10 % de comida en los dos primeros campos.`,"talentos.mano_verde.lore.1":`«Una semilla no distingue entre manos propias y ajenas.»`,"talentos.mano_verde.efecto.1":`+10 % de comida en todos los campos.`,"talentos.mano_verde.lore.2":`«El invierno también escucha, si se le habla con respeto.»`,"talentos.mano_verde.efecto.2":`El invierno rinde ×0,75 de la comida en vez de ×0,5.`,"talentos.mano_verde.lore.3":`«Lo que nace en tu valle ya sabe por dónde empieza el surco.»`,"talentos.mano_verde.efecto.3":`Cada habitante que nace trae «Siembra rápida»: +25 % en el campo.`,"talentos.mano_verde.lore.4":`«De una misma raíz salen dos caminos, y un árbol no sigue ambos.»`,"talentos.mano_verde.efecto.4":`A elegir: +0,02 PE al día por campesino, o +10 % a toda clase de vida.`,"talentos.mano_verde.lore.5":`«El primer hogar aprende a ser más grande de lo que fue.»`,"talentos.mano_verde.efecto.5":`La cuna sube un subnivel.`,"talentos.mano_verde.lore.6":`«Cada otoño la tierra devuelve más de lo que recibió.»`,"talentos.mano_verde.efecto.6":`Cada otoño, tras la cosecha, el valle sube un subnivel para siempre y puede pasar el límite de rango de la tierra.`,"talentos.mano_verde.lore.7":`«El Dao de la cosecha no se cuenta en granos, sino en estaciones.»`,"talentos.mano_verde.efecto.7":`«Tierra del Dao»: el valle sube un rango y la comida que no cabe se vuelve Qi, 1 por cada 10.`,"talentos.ojo.lore.4":`«Lo que cae del cielo pertenece a quien mira hacia arriba.»`,"talentos.ojo.efecto.4":`+25 % de botín, en recursos y en probabilidad de objeto.`,"talentos.ojo.lore.5":`«Todo hallazgo guarda un hermano mayor.»`,"talentos.ojo.efecto.5":`Cada objeto tiene un 25 % de subir un rango.`,"talentos.ojo.lore.6":`«Ningún vacío sobrevive a una mirada atenta.»`,"talentos.ojo.efecto.6":`Ninguna tirada sale vacía.`,"talentos.ojo.lore.7":`«La marea trae a cada cuerpo lo suyo, y a ti, algo más.»`,"talentos.ojo.efecto.7":`El botín sube un rango y cada marea da una tirada más.`,"talentos.vinculo.lore.5":`«Un nombre dicho con intención ata más que una cadena.»`,"talentos.vinculo.efecto.5":`Se vincula con los 5 súbditos de más potencial: cada punto (Hierro 1, Bronce 2, Plata 3) da +0,8 % de Qi y +1 de defensa.`,"talentos.vinculo.lore.6":`«Lo que un héroe sabe, otro puede recordarlo.»`,"talentos.vinculo.efecto.6":`Hereda el potencial y el talento de los 3 héroes de más potencial.`,"talentos.vinculo.lore.7":`«Cuando todos recuerdan lo mismo, el recuerdo se vuelve ley.»`,"talentos.vinculo.efecto.7":`Los vinculados comparten sus talentos: hereda de los 5 héroes de más potencial, cada uno una sola vez.`,"artefactos.caldero.nombre":`Caldero`,"artefactos.estandarte.nombre":`Estandarte`,"artefactos.pagoda.nombre":`Pagoda`,"artefactos.caldero.lore":`«Lo que hierve a fuego lento se vuelve más de lo que era.»`,"artefactos.caldero.efecto":`Cada ranura repite una receta cada 10 días: píldora de Qi, piedra de reunión y, desde Bronce, arma.`,"artefactos.estandarte.lore":`«Un trapo en lo alto es una promesa que mil pies aprenden a seguir.»`,"artefactos.estandarte.efecto":`Escuadras de 5 tropas que ganan méritos en cada marea o cacería y ascienden a guardia, cazadores o lanceros.`,"artefactos.pagoda.lore":`«Cada piso guarda un silencio distinto. Algunos respiran.»`,"artefactos.pagoda.efecto":`Tras ganar una cacería puedes capturar la bestia en vez de llevarte el botín, y te da PE, madera o piedra al día.`,"heroes.dialogo.primera_marea":`«Vi cómo la marea se rompía contra su empalizada. Pocos valles resisten la primera. Quise saber quién los manda.»`,"heroes.dialogo.treinta_familias":`«Treinta humos suben de este valle. Donde hay tanto fuego, siempre hace falta quien lo defienda.»`,"heroes.dialogo.villa":`«Ya no es una aldea. Las montañas lo saben, y los que bajan de ellas también.»`,"heroes.dialogo.fundacion":`«Llevas la Fundación en el pecho. Los viejos dicen que, desde ahí, el Sistema pide más de lo que da.»`,"heroes.dialogo.valle_prospera":`«Se habla de este valle más allá del paso. Dicen que aquí la tierra no se agota.»`,"heroes.dialogo.llamada":`«Me llamaron, y vine. Quien responde a una llamada suele quedarse hasta que la deuda se paga.»`,"ui.heroe.causa.primera_marea":`Llega porque el valle resistió la primera marea.`,"ui.heroe.causa.treinta_familias":`Llega porque el valle ya reúne treinta familias.`,"ui.heroe.causa.villa":`Llega porque el valle se alzó como Villa.`,"ui.heroe.causa.fundacion":`Llega porque el Señor alcanzó la Fundación.`,"ui.heroe.causa.valle_prospera":`Llega porque el valle prosperó.`,"ui.heroe.causa.llamada":`Llega porque lo invocaste en el Altar.`,"misiones.primer_aliento.titulo":`Primer aliento del Dao`,"misiones.rugidos.titulo":`Rugidos en el bosque`,"misiones.primera_marea.titulo":`La primera marea`,"misiones.treinta_familias.titulo":`Treinta familias`,"misiones.novena_capa.titulo":`Novena capa`,"misiones.fundacion.titulo":`Fundación del Dao`,"misiones.valle_prospera.titulo":`El valle prospera`,"misiones.cumbre.titulo":`Cumbre de la Fundación`,"misiones.nucleo.titulo":`Núcleo Dorado`,"misiones.familias.titulo":`Familias nuevas`,"misiones.veta.titulo":`El latido de la veta`,"misiones.muro.titulo":`Muro de troncos`,"misiones.desafio_capa.titulo":`Desafío: la siguiente capa`,"misiones.graneros.titulo":`Graneros llenos`,"misiones.desafio_marea.titulo":`Desafío: la marea`,"consejos.cultivo.texto":`【Sistema】El Qi se acumula solo. Las piedras espirituales lo aceleran.`,"consejos.vivienda.texto":`【Sistema】No queda techo libre. Sin chozas, el valle no crece.`,"consejos.veta.texto":`【Sistema】Bajo el valle duerme una veta. Un pozo espiritual extrae sus piedras.`,"consejos.camara.texto":`【Sistema】Una cámara de meditación multiplica el Qi y ayuda en los grandes avances.`,"consejos.pozos.texto":`【Sistema】Las cámaras multiplican el Qi, no lo crean. Sin piedras espirituales, no hay nada que multiplicar.`,"consejos.invierno.texto":`【Sistema】En invierno, la cosecha cae a la mitad. Lo que no se guarde, faltará.`,"consejos.almacen.texto":`【Sistema】El almacén está casi lleno. Lo que no quepa se perderá.`,"consejos.defensa.texto":`【Sistema】La defensa suma milicia, empalizadas, tropas y el Poder del anfitrión.`,"consejos.castigo.texto":`【Sistema】Esta misión trae castigo. Rechazarla no cuesta nada.`,"consejos.gran_avance.texto":`【Sistema】Un gran avance puede fallar. Las cámaras y las píldoras suben la probabilidad.`,"explicaciones.clases.texto":`Aquí se forman los aldeanos. El que no tiene clase trabaja en cualquier puesto, pero rinde menos. Formarlo cuesta comida y días, y pide un Taller para los oficios o un Campo de entrenamiento para las tropas; después rinde más en lo suyo. Subir a Bronce cuesta además piedras espirituales, y solo algunos tienen el potencial.`,"explicaciones.heroes.texto":`Llegó un héroe. No le quita trabajo a nadie. Elige su tarea: gobernar un edificio para que rinda más, acompañar al anfitrión para darle Qi o liderar las tropas contra las mareas. Sin tarea, solo cuentan algunos de sus talentos y habilidades.`,"explicaciones.altar.texto":`El Altar llama a gente nueva. Cada invocación cuesta recursos y pide una vivienda libre. Puede salir un aldeano, una tropa o, con suerte, un héroe. Una ficha de llamada paga la invocación, pero la vivienda sigue haciendo falta.`,"explicaciones.nucleo.texto":`Juntaste fragmentos suficientes de un mismo grado: con Formar se vuelven un núcleo de talento. Un núcleo se gasta de dos maneras: Girar despierta un talento nuevo de su grado, si te queda un hueco libre; Mejorar sube un talento tuyo al grado siguiente, cuando ya cumplió su tiempo y su prueba. Si todavía no puedes usarlo, guárdalo para después.`,"explicaciones.fusion.texto":`Sobran fragmentos de un grado. Con Refinar fragmentos se funden en uno del grado siguiente.`,"explicaciones.qi.texto":`El Qi es la energía que cultiva el anfitrión. Se acumula sola cada día: las piedras espirituales la aceleran, las cámaras de meditación la multiplican y un héroe que te acompaña suma más. Al llenar la barra subes de capa, y al final de cada reino hace falta un gran avance. Cada etapa sube tu Poder, que también defiende el valle.`,"explicaciones.granAvance.texto":`Tu Qi llenó la barra, pero esta es la cumbre de un reino: de aquí ya no se sube de capa solo. Para pasar al reino siguiente, como de Refinamiento de Qi a Fundación, pulsa Intentar gran avance. Puede fallar: las cámaras de meditación y las píldoras suben la probabilidad, y el Qi que sigas juntando por encima de la barra también ayuda. Si falla, el Qi se desvía: pierdes parte de él y quedas lesionado unos días.`,"explicaciones.marea.texto":`Una marea de bestias baja por el paso cada cierto tiempo, y el Sistema la anuncia con días de margen. Tu defensa suma la milicia (los aldeanos sin clase de tropa), las empalizadas, las tropas y sus torres, los héroes que lideran y el Poder del Señor. Si no alcanza, pierdes recursos, gente y algún edificio. El muro del Valle muestra qué tan preparado estás.`,"explicaciones.cacerias.texto":`Apareció una guarida. Una cacería envía a todas tus tropas: tarda unos días y, mientras, no defienden el valle. Si ganan, traen piedras espirituales y botín; si pierden, algunas mueren y otras vuelven heridas. Mira la probabilidad de victoria antes de salir. Con una marea anunciada no se puede salir, y las guaridas desaparecen si no vas.`,"explicaciones.artefacto.texto":`Tu artefacto natal crece con tus victorias: cada marea o cacería ganada, y cada material del botín, le dan esencia en bruto. Para que cuente hay que Templar: todo el bruto pasa a esencia, pero el artefacto te debilita unos días y tu Qi baja mientras dure. Con suficiente esencia sube de nivel y mejora.`,"explicaciones.aldeanos.texto":`Nace gente mientras haya techo libre y más de 10 de comida, y más rápido cuanto más comida sobra cada día. Las chozas dan techo: si se llenan, el valle deja de crecer. También llega gente por el Altar de llamada, que pide techo libre, por algunos eventos y, los héroes, por los hitos del feudo.`,"explicaciones.codice.texto":`El Códice guarda las reglas del valle: de dónde sale y para qué sirve cada recurso, qué hace cada edificio, los talentos que conoces y cómo se miden las mareas. Está dentro de Más. Consúltalo cuando dudes.`,"eventos.anciano.titulo":`El anciano harapiento`,"eventos.anciano.texto":`Un anciano cubierto de harapos se detiene a la entrada del valle. Pide un cuenco de arroz y un rincón donde dormir. Sus pasos no dejan huella en el barro, aunque nadie más parece notarlo.`,"eventos.anciano.acoger":`Darle comida y techo (−20 comida)`,"eventos.anciano.echar":`Echarlo`,"eventos.tributo_mu.titulo":`Mu Tianhao exige tributo`,"eventos.tributo_mu.texto":`Mu Tianhao, joven maestro de la familia Mu, entra al valle a caballo con sus guardias. Dice que estas tierras pertenecen a su clan y exige madera como tributo. «Un perro de aldea paga o se arrodilla.»`,"eventos.tributo_mu.pagar":`Pagar el tributo (−50 madera)`,"eventos.tributo_mu.negarse":`Negarse (Poder 8+)`,"eventos.revancha.titulo":`La revancha`,"eventos.revancha.texto":`Mu Tianhao vuelve al valle, el mismo que te exigió tributo. Esta vez siente tu Qi desde el paso y palidece. Delante de tus aldeanos se inclina y te pide olvidar el pasado. Todo el valle espera tu respuesta.`,"eventos.revancha.abofetear":`Abofetearlo`,"eventos.revancha.perdonar":`Perdonarlo`,"eventos.refugiados.titulo":`Refugiados del norte`,"eventos.refugiados.texto":`Una columna de familias baja del norte, huyendo de una marea que arrasó sus aldeas. Traen hambre y pocas fuerzas. El granero del valle no alcanza para todos.`,"eventos.refugiados.todos":`Acoger a todos (−40 comida)`,"eventos.refugiados.fuertes":`Acoger solo a los fuertes`,"eventos.refugiados.cerrar":`Cerrar las puertas`,"eventos.caravana.titulo":`Caravana de los Cuatro Mares`,"eventos.caravana.texto":`Una caravana del Gremio de los Cuatro Mares acampa junto al río. Sus mercaderes ofrecen piedra y piedras espirituales a cambio de lo que al valle le sobre.`,"eventos.caravana.madera":`Cambiar madera (−50 madera, +25 piedra)`,"eventos.caravana.comida":`Cambiar comida (−60 comida, +5 PE)`,"eventos.caravana.nada":`Despedir a la caravana`,"eventos.lluvia_qi.titulo":`Lluvia de Qi`,"eventos.lluvia_qi.texto":`El cielo de primavera se tiñe de oro y cae una lluvia cargada de Qi. Meditar bajo ella acelera el cultivo, pero el valle entero querrá mirar el cielo en vez de trabajar.`,"eventos.lluvia_qi.meditar":`Meditar`,"eventos.lluvia_qi.trabajar":`Seguir trabajando`,"eventos.langostas.titulo":`Langostas`,"eventos.langostas.texto":`Una nube de langostas avanza desde el este y oscurece el sol de verano. Si llega a los graneros, devorará la comida guardada. Quemar un campo podría desviarla.`,"eventos.langostas.quemar":`Quemar un campo (−1 campo)`,"eventos.langostas.rezar":`Rezar`,"eventos.invierno_crudo.titulo":`Invierno crudo`,"eventos.invierno_crudo.texto":`Llega una helada como nadie recuerda. La nieve cubre los techos y el frío entra por las rendijas de las chozas. Sin leña de más, alguien podría no ver la primavera.`,"eventos.invierno_crudo.repartir":`Repartir leña (−30 madera)`,"eventos.invierno_crudo.nada":`Esperar a que pase`,"eventos.lobo_herido.titulo":`Lobo espiritual herido`,"eventos.lobo_herido.texto":`Al amanecer, los leñadores encuentran un lobo de pelaje plateado junto al arroyo. Tiene una flecha negra clavada en el costado y gruñe sin fuerzas. Sus ojos brillan con un Qi que ningún animal común posee.`,"eventos.lobo_herido.cazar":`Cazarlo (Poder 10+)`,"eventos.lobo_herido.curar":`Curarlo (−10 comida)`,"eventos.veta_superficial.titulo":`Veta superficial`,"eventos.veta_superficial.texto":`Los mineros del pozo encuentran una veta de piedras espirituales casi a flor de tierra. Excavar deprisa saca más, pero la roca de alrededor cruje. Con cuidado se saca menos y nadie arriesga la vida.`,"eventos.veta_superficial.deprisa":`Excavar deprisa`,"eventos.veta_superficial.cuidado":`Excavar con cuidado`,"eventos.ladron.titulo":`El ladrón de la madre enferma`,"eventos.ladron.texto":`Atrapan a un muchacho flaco robando arroz del granero. Llora y dice que su madre está enferma y no come desde hace días. Los aldeanos esperan tu sentencia.`,"eventos.ladron.perdonar":`Perdonarlo (−10 comida)`,"eventos.ladron.castigar":`Castigarlo`,"eventos.pergamino.titulo":`Pergamino en las ruinas`,"eventos.pergamino.texto":`Entre las ruinas al pie del monte, un leñador encuentra un pergamino de seda que no se pudre. Sus trazos hablan de una técnica de cultivo olvidada. Un mercader ya preguntó cuánto pides por él.`,"eventos.pergamino.estudiar":`Estudiarlo`,"eventos.pergamino.vender":`Venderlo a la caravana`,"eventos.discipulo_espada.titulo":`Discípulo herido de la Espada Celeste`,"eventos.discipulo_espada.texto":`Un discípulo de la Secta de la Espada Celeste yace herido junto al camino, con la espada rota. De su cinturón cuelga una bolsa pesada de piedras espirituales. Nadie más lo ha visto.`,"eventos.discipulo_espada.socorrer":`Socorrerlo (−20 comida)`,"eventos.discipulo_espada.robar":`Robarle la bolsa`,"eventos.veta_habla.titulo":`La veta habla`,"eventos.veta_habla.texto":`Mientras meditas, una voz sube desde la veta bajo el valle. No usa palabras, pero la entiendes: algo dormido allá abajo te llama por tu nombre.`,"eventos.veta_habla.escuchar":`Escuchar la voz`,"eventos.veta_habla.sellar":`Sellar el sueño`,"eventos.sistema_falla.titulo":`El Sistema falla`,"eventos.sistema_falla.texto":`【Sistema】Error. Error. Anfitrión, la veta no debería… Reiniciando. Durante un instante el mundo se detiene y la voz del Sistema tiembla como nunca antes.`,"eventos.sistema_falla.continuar":`Continuar`,"eventos.anciano.acoger.exito":`Al alba, el anciano se sienta frente a la cámara y respira despacio. El Qi del valle lo sigue como un perro.`,"eventos.anciano.acoger.fracaso":`El anciano come en silencio, duerme bajo tu techo y se marcha antes del alba sin dejar huella.`,"eventos.anciano.echar.exito":`El anciano se aleja por el camino del paso. No vuelve la cabeza.`,"eventos.tributo_mu.pagar.exito":`Los criados de Mu Tianhao cargan la madera en sus carros. Él ni siquiera baja del caballo.`,"eventos.tributo_mu.negarse.exito":`Mu Tianhao choca con tu Qi y retrocede. En su prisa por irse, olvida una bolsa de piedras espirituales.`,"eventos.tributo_mu.negarse.fracaso":`Los guardias de Mu Tianhao saquean el granero. Un aldeano que se interpuso no vuelve a levantarse.`,"eventos.revancha.abofetear.exito":`El golpe resuena en todo el valle. Mu Tianhao paga en piedra y en piedras espirituales para que nadie lo cuente.`,"eventos.revancha.perdonar.exito":`Mu Tianhao se inclina, rígido de vergüenza. Al día siguiente llegan carros de madera sin una palabra.`,"eventos.refugiados.todos.exito":`Familias enteras cruzan el paso con lo puesto. Esa noche el valle cena menos y duerme más apretado.`,"eventos.refugiados.fuertes.exito":`Dos hombres de brazos anchos se quedan. Los demás siguen hacia el sur sin mirar atrás.`,"eventos.refugiados.cerrar.exito":`Las puertas se cierran. Durante la noche se oyen pasos que se alejan por el camino.`,"eventos.caravana.madera.exito":`El Gremio de los Cuatro Mares pesa la madera dos veces y paga en piedra labrada.`,"eventos.caravana.comida.exito":`El mercader prueba el arroz, asiente y cuenta unas pocas piedras espirituales sobre la mesa.`,"eventos.caravana.nada.exito":`La caravana levanta polvo en el camino del sur y se pierde tras la colina.`,"eventos.lluvia_qi.meditar.exito":`El Señor medita bajo la lluvia dorada. En los campos, el trabajo se detiene para mirar el cielo.`,"eventos.lluvia_qi.trabajar.exito":`La lluvia de Qi cae sobre los tejados y se escurre hacia el río. Nadie levanta la vista.`,"eventos.langostas.quemar.exito":`El humo negro sube del campo en llamas. Las langostas giran, dudan y se van hacia el este.`,"eventos.langostas.rezar.exito":`Las langostas pasan sobre el valle como una nube y siguen de largo. Nadie sabe a quién agradecer.`,"eventos.langostas.rezar.fracaso":`La nube de langostas baja sobre los graneros. Al amanecer solo quedan cáscaras y polvo.`,"eventos.invierno_crudo.repartir.exito":`Las chimeneas humean toda la noche. Al amanecer, la nieve cubre los campos y nadie falta.`,"eventos.invierno_crudo.nada.exito":`La helada entra por las rendijas. Al amanecer, una choza no enciende su fuego.`,"eventos.invierno_crudo.nada.fracaso":`El frío aprieta tres noches y luego cede. El valle despierta entero, aunque tiritando.`,"eventos.lobo_herido.cazar.exito":`El lobo cae sin un gemido. Nada de él se desperdicia.`,"eventos.lobo_herido.cazar.fracaso":`El lobo se revuelve. Un leñador no vuelve a casa.`,"eventos.lobo_herido.curar.exito":`Al tercer día, el lobo duerme junto a la empalizada. Nadie se atreve a echarlo.`,"eventos.lobo_herido.curar.fracaso":`Una mañana el lobo ya no está. Solo quedan sus huellas junto al arroyo.`,"eventos.veta_superficial.deprisa.exito":`Los picos golpean sin pausa y la veta se abre limpia. Las piedras espirituales brillan en el barro.`,"eventos.veta_superficial.deprisa.fracaso":`La galería cede con un crujido. Las piedras salen, pero un minero queda bajo la roca.`,"eventos.veta_superficial.cuidado.exito":`Los mineros apuntalan cada paso. Sacan menos, y todos vuelven a cenar.`,"eventos.ladron.perdonar.exito":`El muchacho le lleva el arroz a su madre. Al día siguiente lo ves barriendo frente al pabellón.`,"eventos.ladron.castigar.exito":`El ladrón devuelve lo robado bajo la mirada de todo el valle. Nadie vuelve a tocar el granero.`,"eventos.pergamino.estudiar.exito":`Las líneas del pergamino se mueven al leerlas. El Qi del Señor sigue su trazo hasta el amanecer.`,"eventos.pergamino.vender.exito":`El mercader paga sin regatear, y eso es lo que más inquieta.`,"eventos.discipulo_espada.socorrer.exito":`El discípulo se recupera y deja unas piedras espirituales al partir. Jura que la Espada Celeste no olvida.`,"eventos.discipulo_espada.robar.exito":`La bolsa pesa más de lo esperado. Cuando el discípulo despierte, mirará hacia el valle.`,"eventos.veta_habla.escuchar.exito":`La voz de la veta llena la cámara. Cuando calla, el Qi del Señor ya no es el mismo.`,"eventos.veta_habla.sellar.exito":`El Señor sella la grieta con su propio Qi. Abajo, algo vuelve a dormirse.`,"eventos.sistema_falla.continuar.exito":`Ding. Error. Error. Reinicio completado. Compensación por las molestias entregada.`,"errores.sinRecursos":`No alcanzan los recursos. Espera a reunirlos o produce más.`,"errores.excedeTope":`Ese costo supera el tope del almacén. Amplía el almacén para poder pagarlo.`,"errores.sinPuestos":`No quedan puestos libres en ese oficio. Construye edificios que los abran.`,"errores.sinTrabajadores":`No quedan habitantes sin ocupar. Libera a alguien de otro oficio.`,"errores.sinPlano":`Falta el plano de este edificio. Búscalo en el botín de las cacerías.`,"errores.requisito":`No se cumple el requisito. Revisa lo que pide y vuelve a intentarlo.`,"errores.unica":`Solo puede haber uno. Ya lo tienes o está en obra.`,"errores.maximo":`Ya llegaste al máximo. No se puede ampliar más.`,"errores.responderEvento.requisito":`No queda techo libre en el valle.`,"errores.noDisponible":`Eso no está disponible ahora. Espera a que cambie la situación.`,"errores.pendiente":`Hay una decisión pendiente. Resuélvela antes de seguir.`,"errores.terminado":`La crónica ya terminó. Empieza una partida nueva.`,"errores.asignar.requisito":`La cantidad no es válida. Escribe un número entero desde 0.`,"errores.reservaPe.requisito":`La reserva no es válida. Indica una cantidad de piedras espirituales o quita la reserva.`,"recursos.comida":`Comida`,"recursos.madera":`Madera`,"recursos.piedra":`Piedra`,"recursos.pe":`Piedras espirituales`,"oficios.campesino":`Campesino`,"oficios.lenador":`Leñador`,"oficios.cantero":`Cantero`,"oficios.minero":`Minero`,"oficios.tropa":`Tropa`,"sucesos.inicio":`【Sistema】Ding. Anfitrión registrado. Comienza la crónica.`,"sucesos.aviso":`【Sistema】Aviso del Sistema.`,"sucesos.fin":`【Sistema】Ding. {etapa}. La crónica del valle concluye.`,"sucesos.fin.hambre":`【Sistema】El hambre vació el valle: solo queda un habitante y el feudo cae. La crónica concluye.`,"sucesos.fin.marea":`【Sistema】La marea de bestias dejó un solo habitante y el feudo cae. La crónica concluye.`,"sucesos.hambre":`No hay comida: el hambre ronda el valle.`,"sucesos.hambre.avisa":`Se acabó la comida y el valle empieza a pasar hambre.`,"sucesos.hambre.muere":`El hambre se lleva a un habitante del valle.`,"sucesos.mision":`【Sistema】Misión: «{titulo}».`,"sucesos.mision.abierta":`【Sistema】Misión disponible: «{titulo}».`,"sucesos.mision.ofrecida":`【Sistema】Misión disponible: «{titulo}».`,"sucesos.mision.aceptada":`【Sistema】Misión aceptada: «{titulo}».`,"sucesos.mision.rechazada":`【Sistema】Misión rechazada: «{titulo}».`,"sucesos.mision.retirada":`【Sistema】Misión retirada: «{titulo}».`,"sucesos.mision.cumplida":`【Sistema】Ding. Misión completada: «{titulo}».`,"sucesos.mision.fallida":`【Sistema】Misión fallida: «{titulo}».`,"sucesos.consejo":`{texto}`,"sucesos.evento":`{titulo}.`,"sucesos.evento.abierto":`Llega un asunto al valle: {titulo}.`,"sucesos.evento.resuelto":`Se resuelve el asunto: {titulo}.`,"sucesos.marea":`Marea de bestias número {n}.`,"sucesos.marea.ganada":`La marea de bestias número {n} se estrella contra la defensa.`,"sucesos.marea.perdida":`La marea de bestias número {n} rompe la defensa del valle.`,"sucesos.construir":`Se levanta {edificio}.`,"sucesos.villa":`El valle se eleva a villa.`,"sucesos.gran_avance":`El Señor intenta un gran avance.`,"sucesos.gran_avance.exito":`El gran avance tiene éxito.`,"sucesos.gran_avance.fallo":`Desviación del Qi: el gran avance falla.`,"sucesos.etapa":`El Señor alcanza {etapa}.`,"sucesos.talento":`Un talento cambia.`,"sucesos.talento.tierraMadura":`La tierra madura: el valle sube un subnivel.`,"sucesos.talento.inicial":`Despierta el talento {talento}.`,"sucesos.talento.nucleo":`Se forma un núcleo de talento.`,"sucesos.talento.deshacerNucleo":`Se deshace un núcleo de talento.`,"sucesos.talento.refinar":`Se refinan fragmentos de talento.`,"sucesos.talento.refinarNucleos":`Se refinan núcleos de talento.`,"sucesos.talento.giro":`Un núcleo gira y trae el talento {talento}.`,"sucesos.talento.mejora":`El talento {talento} mejora.`,"sucesos.talento.bifurcacion":`El talento {talento} toma una rama.`,"sucesos.artefacto":`El artefacto cambia.`,"sucesos.artefacto.nivel":`El artefacto se fortalece.`,"sucesos.artefacto.elegido":`El artefacto natal es {artefacto}.`,"sucesos.artefacto.templar":`El artefacto se templa y queda débil unos días.`,"sucesos.artefacto.ascenso":`Una escuadra asciende bajo el Estandarte.`,"sucesos.formacion":`La gente se forma para el combate.`,"sucesos.formacion.comienza":`Comienza una formación: {clase}.`,"sucesos.formacion.termina":`Termina una formación: {clase}.`,"sucesos.heroe":`{nombre} llega al valle.`,"sucesos.heroe.llegada":`{nombre} llega al valle.`,"sucesos.heroe.llamada":`{nombre} responde a la llamada.`,"sucesos.poblacion":`Cambia la población del valle.`,"sucesos.poblacion.nace":`Nace un habitante en el valle.`,"sucesos.poblacion.sale":`Un habitante deja el valle.`,"sucesos.invocacion":`El Altar de llamada responde.`,"sucesos.caceria":`Algo se mueve en las guaridas.`,"sucesos.caceria.guarida":`Se descubre la guarida {guarida}.`,"sucesos.caceria.salida":`Una partida sale hacia la guarida {guarida}.`,"sucesos.caceria.vuelta_ganada":`La partida vuelve victoriosa de la guarida {guarida}.`,"sucesos.caceria.vuelta_perdida":`La partida vuelve derrotada de la guarida {guarida}.`,"sucesos.botin":`Una tirada de botín.`,"sucesos.botin.nada":`La tirada de botín no trae nada.`,"sucesos.botin.fragmentos":`La tirada de botín trae fragmentos de talento.`,"sucesos.botin.ficha":`La tirada de botín trae una ficha de llamada.`,"sucesos.botin.material":`La tirada de botín trae materiales.`,"sucesos.botin.objeto":`La tirada de botín trae un objeto de tierra.`,"sucesos.botin.plano":`La tirada de botín trae un plano.`,"sucesos.botin.nucleo":`La tirada de botín trae un núcleo de talento.`,"sucesos.botin.aplicado":`Un objeto se aplica a la tierra.`,"ui.etiqueta.Sistema":`Sistema`,"ui.etiqueta.Evento":`Evento`,"ui.etiqueta.Marea":`Marea`,"ui.etiqueta.Obra":`Obra`,"ui.etiqueta.Cultivo":`Cultivo`,"ui.etiqueta.Gente":`Gente`,"ui. e.contexto":`En la cima de la Fundación el camino se estrecha. Pocos llegan y menos aún siguen sin mirar atrás.`,"misiones.nucleo.contexto":`Lo que el valle y tú han reunido cabe por fin en una sola esfera dorada.`,"misiones.familias.contexto":`Corre la voz de que en tu valle hay sopa caliente. Algunas familias ya vienen por el camino.`,"misiones.veta.contexto":`Los mineros golpean la roca y suena distinto: hay Qi dentro. Unas manos más podrían sacarlo.`,"misiones.muro.contexto":`Las palizadas viejas no detendrán lo que viene. Más troncos, más altos, y que cierren bien.`,"misiones.desafio_capa.contexto":`El Sistema te reta a ir más allá de lo que crees poder. Si el plazo se agota sin que subas de capa, tu cuerpo lo pagará con una lesión.`,"misiones.graneros.contexto":`Un mal invierno vacía hasta los mejores almacenes. Mejor llenarlos antes de que la nieve decida.`,"misiones.desafio_marea.contexto":`El Sistema apuesta a que resistirás la próxima marea. Si el valle cae, se llevará parte de lo que guardas.`,"ui.misiones.historial":`Historial`,"ui.misiones.historialVacio":`Aún no has cerrado ninguna misión.`,"ui.misiones.historialFila":`{resultado} · {fecha}`,"ui.misiones.resultado.cumplida":`Cumplida`,"ui.misiones.resultado.fallida":`Fallida`,"ui.misiones.resultado.retirada":`Retirada`,"ui.misiones.resultado.rechazada":`Rechazada`,"ui.talentos.fichaVer":`Ver ficha`,"ui.talentos.fichaVerNombre":`Ver ficha de {talento}`,"ui.talentos.fichaOcultar":`Ocultar ficha`,"ui.talentos.fichaOcultarNombre":`Ocultar ficha de {talento}`,"ui.talentos.fichaNombre":`Ficha de {talento}`,"ui.talentos.fichaNace":`Nace en el grado {grado}`,"ui.talentos.fichaAhora":`Grado actual: {grado}`,"ui.talentos.fichaGrados":`Grados`,"ui.talentos.fichaActual":`Actual`,"ui.talentos.fichaSiguiente":`Siguiente`,"ui.talentos.fichaBifurcacion":`Bifurcación en el grado {grado}`,"ui.talentos.fichaBifFutura":`Se elige al llegar a ese grado. Solo una rama se queda.`,"ui.talentos.fichaBifPendiente":`Aún no has el  Qi y avanzar en su cultivo. También se gastan en algunas obras y al formar o llamar gente.`,"ui.codice.costo":`Costo base`,"ui.codice.factor":`Cada copia más cuesta {factor} % de la anterior.`,"ui.codice.genera":`Genera {recurso} con el trabajo de su gente.`,"ui.codice.puestos":`{n} puestos de {oficio}`,"ui.codice.puestosUno":`1 puesto de {oficio}`,"ui.codice.edificio.plano":`Hace falta su plano: sale en el botín.`,"ui.codice.edificio.maximo":`Máximo: {n}.`,"ui.codice.edificio.unica":`Solo puede haber uno.`,"ui.codice.edificio.requisitos":`Pide {poblacion} habitantes y que el valle esté en el subnivel {subnivel}.`,"ui.codice.edificio.dias":`Tarda {n} días en terminarse.`,"ui.codice.talentos.ayuda":`Todos los talentos del juego, también los que aún no tienes.`,"ui.codice.talento.tienes":`Lo tienes, en el grado {grado}`,"ui.codice.talento.nace":`Aún no lo tienes. Nace en el grado {grado}`,"ui.codice.marea.intervalo":`Una marea de bestias llega cada {n} días.`,"ui.codice.marea.aviso":`El Sistema avisa {n} días antes, con tu probabilidad de victoria.`,"ui.codice.marea.proxima":`Próxima marea`,"ui.codice.marea.titulo":`Fuerza y defensa`,"ui.codice.marea.fuerza":`La fuerza de la marea sube a {g} % de la anterior cada vez que vences una. La primera tiene {f0}.`,"ui.codice.marea.defensa":`No hay victoria segura: cuanto más alta es tu defensa frente a la fuerza de la marea, más probable es vencer. La primera marea del tutorial es la excepción: queda protegida si tu defensa alcanza la que pide su misión.`,"ui.codice.marea.suma":`Suman a tu defensa: la base ({base}), cada habitante que no es tropa ni héroe ({milicia}), las empalizadas, las tropas, los héroes, el poder de la etapa del Señor, las bestias de la Pagoda y otros efectos.`,"ui.codice.marea.pierdes":`Si pierdes`,"ui.codice.marea.pierdeRecursos":`Pierdes {pct} de la comida, la madera y la piedra.`,"ui.codice.marea.pierdeGente":`Muere {pct} de tu gente, al menos 1 habitante.`,"ui.codice.marea.pierdeHerida":`El Señor su
