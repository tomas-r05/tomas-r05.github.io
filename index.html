lentos.mano_verde.efecto.3":`Cada habitante que nace trae «Siembra rápida»: +25 % en el campo.`,"talentos.mano_verde.lore.4":`«De una misma raíz salen dos caminos, y un árbol no sigue ambos.»`,"talentos.mano_verde.efecto.4":`A elegir: +0,02 PE al día por campesino, o +10 % a toda clase de vida.`,"talentos.mano_verde.lore.5":`«El primer hogar aprende a ser más grande de lo que fue.»`,"talentos.mano_verde.efecto.5":`La cuna sube un subnivel.`,"talentos.mano_verde.lore.6":`«Cada otoño la tierra devuelve más de lo que recibió.»`,"talentos.mano_verde.efecto.6":`Cada otoño, tras la cosecha, el valle sube un subnivel para siempre y puede pasar el límite de rango de la tierra.`,"talentos.mano_verde.lore.7":`«El Dao de la cosecha no se cuenta en granos, sino en estaciones.»`,"talentos.mano_verde.efecto.7":`«Tierra del Dao»: el valle sube un rango y la comida que no cabe se vuelve Qi, 1 por cada 10.`,"talentos.ojo.lore.4":`«Lo que cae del cielo pertenece a quien mira hacia arriba.»`,"talentos.ojo.efecto.4":`+25 % de botín, en recursos y en probabilidad de objeto.`,"talentos.ojo.lore.5":`«Todo hallazgo guarda un hermano mayor.»`,"talentos.ojo.efecto.5":`Cada objeto tiene un 25 % de subir un rango.`,"talentos.ojo.lore.6":`«Ningún vacío sobrevive a una mirada atenta.»`,"talentos.ojo.efecto.6":`Ninguna tirada sale vacía.`,"talentos.ojo.lore.7":`«La marea trae a cada cuerpo lo suyo, y a ti, algo más.»`,"talentos.ojo.efecto.7":`El botín sube un rango y cada marea da una tirada más.`,"talentos.vinculo.lore.5":`«Un nombre dicho con intención ata más que una cadena.»`,"talentos.vinculo.efecto.5":`Se vincula con los 5 súbditos de más potencial: cada punto (Hierro 1, Bronce 2, Plata 3) da +0,8 % de Qi y +1 de defensa.`,"talentos.vinculo.lore.6":`«Lo que un héroe sabe, otro puede recordarlo.»`,"talentos.vinculo.efecto.6":`Hereda el potencial y el talento de los 3 héroes de más potencial.`,"talentos.vinculo.lore.7":`«Cuando todos recuerdan lo mismo, el recuerdo se vuelve ley.»`,"talentos.vinculo.efecto.7":`Los vinculados comparten sus talentos: hereda de los 5 héroes de más potencial, cada uno una sola vez.`,"artefactos.caldero.nombre":`Caldero`,"artefactos.estandarte.nombre":`Estandarte`,"artefactos.pagoda.nombre":`Pagoda`,"artefactos.caldero.lore":`«Lo que hierve a fuego lento se vuelve más de lo que era.»`,"artefactos.caldero.efecto":`Cada ranura repite una receta cada 10 días: píldora de Qi, piedra de reunión y, desde Bronce, arma.`,"artefactos.estandarte.lore":`«Un trapo en lo alto es una promesa que mil pies aprenden a seguir.»`,"artefactos.estandarte.efecto":`Escuadras de 5 tropas que ganan méritos en cada marea o cacería y ascienden a guardia, cazadores o lanceros.`,"artefactos.pagoda.lore":`«Cada piso guarda un silencio distinto. Algunos respiran.»`,"artefactos.pagoda.efecto":`Tras ganar una cacería puedes capturar la bestia en vez de llevarte el botín, y te da PE, madera o piedra al día.`,"heroes.dialogo.primera_marea":`«Vi cómo la marea se rompía contra su empalizada. Pocos valles resisten la primera. Quise saber quién los manda.»`,"heroes.dialogo.treinta_familias":`«Treinta humos suben de este valle. Donde hay tanto fuego, siempre hace falta quien lo defienda.»`,"heroes.dialogo.villa":`«Ya no es una aldea. Las montañas lo saben, y los que bajan de ellas también.»`,"heroes.dialogo.fundacion":`«Llevas la Fundación en el pecho. Los viejos dicen que, desde ahí, el Sistema pide más de lo que da.»`,"heroes.dialogo.valle_prospera":`«Se habla de este valle más allá del paso. Dicen que aquí la tierra no se agota.»`,"heroes.dialogo.llamada":`«Me llamaron, y vine. Quien responde a una llamada suele quedarse hasta que la deuda se paga.»`,"ui.heroe.causa.primera_marea":`Llega porque el valle resistió la primera marea.`,"ui.heroe.causa.treinta_familias":`Llega porque el valle ya reúne treinta familias.`,"ui.heroe.causa.villa":`Llega porque el valle se alzó como Villa.`,"ui.heroe.causa.fundacion":`Llega porque el Señor alcanzó la Fundación.`,"ui.heroe.causa.valle_prospera":`Llega porque el valle prosperó.`,"ui.heroe.causa.llamada":`Llega porque lo invocaste en el Altar.`,"misiones.primer_aliento.titulo":`Primer aliento del Dao`,"misiones.rugidos.titulo":`Rugidos en el bosque`,"misiones.primera_marea.titulo":`La primera marea`,"misiones.treinta_familias.titulo":`Treinta familias`,"misiones.novena_capa.titulo":`Novena capa`,"misiones.fundacion.titulo":`Fundación del Dao`,"misiones.valle_prospera.titulo":`El valle prospera`,"misiones.cumbre.titulo":`Cumbre de la Fundación`,"misiones.nucleo.titulo":`Núcleo Dorado`,"misiones.familias.titulo":`Familias nuevas`,"misiones.veta.titulo":`El latido de la veta`,"misiones.muro.titulo":`Muro de troncos`,"misiones.desafio_capa.titulo":`Desafío: la siguiente capa`,"misiones.graneros.titulo":`Graneros llenos`,"misiones.desafio_marea.titulo":`Desafío: la marea`,"consejos.cultivo.texto":`【Sistema】El Qi se acumula solo. Las piedras espirituales lo aceleran.`,"consejos.vivienda.texto":`【Sistema】No queda techo libre. Sin chozas, el valle no crece.`,"consejos.veta.texto":`【Sistema】Bajo el valle duerme una veta. Un pozo espiritual extrae sus piedras.`,"consejos.camara.texto":`【Sistema】Una cámara de meditación multiplica el Qi y ayuda en los grandes avances.`,"consejos.pozos.texto":`【Sistema】Las cámaras multiplican el Qi, no lo crean. Sin piedras espirituales, no hay nada que multiplicar.`,"consejos.invierno.texto":`【Sistema】En invierno, la cosecha cae a la mitad. Lo que no se guarde, faltará.`,"consejos.almacen.texto":`【Sistema】El almacén está casi lleno. Lo que no quepa se perderá.`,"consejos.defensa.texto":`【Sistema】La defensa suma milicia, empalizadas, tropas y el Poder del anfitrión.`,"consejos.castigo.texto":`【Sistema】Esta misión trae castigo. Rechazarla no cuesta nada.`,"consejos.gran_avance.texto":`【Sistema】Un gran avance puede fallar. Las cámaras y las píldoras suben la probabilidad.`,"explicaciones.clases.texto":`Aquí se forman los aldeanos. El que no tiene clase trabaja en cualquier puesto, pero rinde menos. Formarlo cuesta comida y días, y pide un Taller para los oficios o un Campo de entrenamiento para las tropas; después rinde más en lo suyo. Subir a Bronce cuesta además piedras espirituales, y solo algunos tienen el potencial.`,"explicaciones.heroes.texto":`Llegó un héroe. No le quita trabajo a nadie. Elige su tarea: gobernar un edificio para que rinda más, acompañar al anfitrión para darle Qi o liderar las tropas contra las mareas. Sin tarea, solo cuentan algunos de sus talentos y habilidades.`,"explicaciones.altar.texto":`El Altar llama a gente nueva. Cada invocación cuesta recursos y pide una vivienda libre. Puede salir un aldeano, una tropa o, con suerte, un héroe. Una ficha de llamada paga la invocación, pero la vivienda sigue haciendo falta.`,"explicaciones.nucleo.texto":`Tienes con qué usar un núcleo. Se forma con Formar y se gasta de dos maneras: Girar despierta un talento nuevo de su grado, si queda un hueco libre; Mejorar sube un talento tuyo al grado siguiente, cuando ya cumplió su tiempo y su prueba.`,"explicaciones.fusion.texto":`Sobran fragmentos de un grado. Con Refinar fragmentos se funden en uno del grado siguiente.`,"explicaciones.qi.texto":`El Qi es la energía que cultiva el anfitrión. Se acumula sola cada día: las piedras espirituales la aceleran, las cámaras de meditación la multiplican y un héroe que te acompaña suma más. Al llenar la barra subes de capa, y al final de cada reino hace falta un gran avance. Cada etapa sube tu Poder, que también defiende el valle.`,"explicaciones.aldeanos.texto":`Nace gente mientras haya techo libre y más de 10 de comida, y más rápido cuanto más comida sobra cada día. Las chozas dan techo: si se llenan, el valle deja de crecer. También llega gente por el Altar de llamada, que pide techo libre, por algunos eventos y, los héroes, por los hitos del feudo.`,"explicaciones.codice.texto":`El Códice guarda las reglas del valle: de dónde sale y para qué sirve cada recurso, qué hace cada edificio, los talentos que conoces y cómo se miden las mareas. Está dentro de Más. Consúltalo cuando dudes.`,"eventos.anciano.titulo":`El anciano harapiento`,"eventos.anciano.acoger":`Darle comida y techo (−20 comida)`,"eventos.anciano.echar":`Echarlo`,"eventos.tributo_mu.titulo":`Mu Tianhao exige tributo`,"eventos.tributo_mu.pagar":`Pagar el tributo (−50 madera)`,"eventos.tributo_mu.negarse":`Negarse (Poder 8+)`,"eventos.revancha.titulo":`La revancha`,"eventos.revancha.abofetear":`Abofetearlo`,"eventos.revancha.perdonar":`Perdonarlo`,"eventos.refugiados.titulo":`Refugiados del norte`,"eventos.refugiados.todos":`Acoger a todos (−40 comida)`,"eventos.refugiados.fuertes":`Acoger solo a los fuertes`,"eventos.refugiados.cerrar":`Cerrar las puertas`,"eventos.caravana.titulo":`Caravana de los Cuatro Mares`,"eventos.caravana.madera":`Cambiar madera (−50 madera, +25 piedra)`,"eventos.caravana.comida":`Cambiar comida (−60 comida, +5 PE)`,"eventos.caravana.nada":`Despedir a la caravana`,"eventos.lluvia_qi.titulo":`Lluvia de Qi`,"eventos.lluvia_qi.meditar":`Meditar`,"eventos.lluvia_qi.trabajar":`Seguir trabajando`,"eventos.langostas.titulo":`Langostas`,"eventos.langostas.quemar":`Quemar un campo (−1 campo)`,"eventos.langostas.rezar":`Rezar`,"eventos.invierno_crudo.titulo":`Invierno crudo`,"eventos.invierno_crudo.repartir":`Repartir leña (−30 madera)`,"eventos.invierno_crudo.nada":`Esperar a que pase`,"eventos.lobo_herido.titulo":`Lobo espiritual herido`,"eventos.lobo_herido.cazar":`Cazarlo (Poder 10+)`,"eventos.lobo_herido.curar":`Curarlo (−10 comida)`,"eventos.veta_superficial.titulo":`Veta superficial`,"eventos.veta_superficial.deprisa":`Excavar deprisa`,"eventos.veta_superficial.cuidado":`Excavar con cuidado`,"eventos.ladron.titulo":`El ladrón de la madre enferma`,"eventos.ladron.perdonar":`Perdonarlo (−10 comida)`,"eventos.ladron.castigar":`Castigarlo`,"eventos.pergamino.titulo":`Pergamino en las ruinas`,"eventos.pergamino.estudiar":`Estudiarlo`,"eventos.pergamino.vender":`Venderlo a la caravana`,"eventos.discipulo_espada.titulo":`Discípulo herido de la Espada Celeste`,"eventos.discipulo_espada.socorrer":`Socorrerlo (−20 comida)`,"eventos.discipulo_espada.robar":`Robarle la bolsa`,"eventos.veta_habla.titulo":`La veta habla`,"eventos.veta_habla.escuchar":`Escuchar la voz`,"eventos.veta_habla.sellar":`Sellar el sueño`,"eventos.sistema_falla.titulo":`El Sistema falla`,"eventos.sistema_falla.continuar":`Continuar`,"eventos.anciano.acoger.exito":`Al alba, el anciano se sienta frente a la cámara y respira despacio. El Qi del valle lo sigue como un perro.`,"eventos.anciano.acoger.fracaso":`El anciano come en silencio, duerme bajo tu techo y se marcha antes del alba sin dejar huella.`,"eventos.anciano.echar.exito":`El anciano se aleja por el camino del paso. No vuelve la cabeza.`,"eventos.tributo_mu.pagar.exito":`Los criados de Mu Tianhao cargan la madera en sus carros. Él ni siquiera baja del caballo.`,"eventos.tributo_mu.negarse.exito":`Mu Tianhao choca con tu Qi y retrocede. En su prisa por irse, olvida una bolsa de piedras espirituales.`,"eventos.tributo_mu.negarse.fracaso":`Los guardias de Mu Tianhao saquean el granero. Un aldeano que se interpuso no vuelve a levantarse.`,"eventos.revancha.abofetear.exito":`El golpe resuena en todo el valle. Mu Tianhao paga en piedra y en piedras espirituales para que nadie lo cuente.`,"eventos.revancha.perdonar.exito":`Mu Tianhao se inclina, rígido de vergüenza. Al día siguiente llegan carros de madera sin una palabra.`,"eventos.refugiados.todos.exito":`Familias enteras cruzan el paso con lo puesto. Esa noche el valle cena menos y duerme más apretado.`,"eventos.refugiados.fuertes.exito":`Dos hombres de brazos anchos se quedan. Los demás siguen hacia el sur sin mirar atrás.`,"eventos.refugiados.cerrar.exito":`Las puertas se cierran. Durante la noche se oyen pasos que se alejan por el camino.`,"eventos.caravana.madera.exito":`El Gremio de los Cuatro Mares pesa la madera dos veces y paga en piedra labrada.`,"eventos.caravana.comida.exito":`El mercader prueba el arroz, asiente y cuenta unas pocas piedras espirituales sobre la mesa.`,"eventos.caravana.nada.exito":`La caravana levanta polvo en el camino del sur y se pierde tras la colina.`,"eventos.lluvia_qi.meditar.exito":`El Señor medita bajo la lluvia dorada. En los campos, el trabajo se detiene para mirar el cielo.`,"eventos.lluvia_qi.trabajar.exito":`La lluvia de Qi cae sobre los tejados y se escurre hacia el río. Nadie levanta la vista.`,"eventos.langostas.quemar.exito":`El humo negro sube del campo en llamas. Las langostas giran, dudan y se van hacia el este.`,"eventos.langostas.rezar.exito":`Las langostas pasan sobre el valle como una nube y siguen de largo. Nadie sabe a quién agradecer.`,"eventos.langostas.rezar.fracaso":`La nube de langostas baja sobre los graneros. Al amanecer solo quedan cáscaras y polvo.`,"eventos.invierno_crudo.repartir.exito":`Las chimeneas humean toda la noche. Al amanecer, la nieve cubre los campos y nadie falta.`,"eventos.invierno_crudo.nada.exito":`La helada entra por las rendijas. Al amanecer, una choza no enciende su fuego.`,"eventos.invierno_crudo.nada.fracaso":`El frío aprieta tres noches y luego cede. El valle despierta entero, aunque tiritando.`,"eventos.lobo_herido.cazar.exito":`El lobo cae sin un gemido. Nada de él se desperdicia.`,"eventos.lobo_herido.cazar.fracaso":`El lobo se revuelve. Un leñador no vuelve a casa.`,"eventos.lobo_herido.curar.exito":`Al tercer día, el lobo duerme junto a la empalizada. Nadie se atreve a echarlo.`,"eventos.lobo_herido.curar.fracaso":`Una mañana el lobo ya no está. Solo quedan sus huellas junto al arroyo.`,"eventos.veta_superficial.deprisa.exito":`Los picos golpean sin pausa y la veta se abre limpia. Las piedras espirituales brillan en el barro.`,"eventos.veta_superficial.deprisa.fracaso":`La galería cede con un crujido. Las piedras salen, pero un minero queda bajo la roca.`,"eventos.veta_superficial.cuidado.exito":`Los mineros apuntalan cada paso. Sacan menos, y todos vuelven a cenar.`,"eventos.ladron.perdonar.exito":`El muchacho le lleva el arroz a su madre. Al día siguiente lo ves barriendo frente al pabellón.`,"eventos.ladron.castigar.exito":`El ladrón devuelve lo robado bajo la mirada de todo el valle. Nadie vuelve a tocar el granero.`,"eventos.pergamino.estudiar.exito":`Las líneas del pergamino se mueven al leerlas. El Qi del Señor sigue su trazo hasta el amanecer.`,"eventos.pergamino.vender.exito":`El mercader paga sin regatear, y eso es lo que más inquieta.`,"eventos.discipulo_espada.socorrer.exito":`El discípulo se recupera y deja unas piedras espirituales al partir. Jura que la Espada Celeste no olvida.`,"eventos.discipulo_espada.robar.exito":`La bolsa pesa más de lo esperado. Cuando el discípulo despierte, mirará hacia el valle.`,"eventos.veta_habla.escuchar.exito":`La voz de la veta llena la cámara. Cuando calla, el Qi del Señor ya no es el mismo.`,"eventos.veta_habla.sellar.exito":`El Señor sella la grieta con su propio Qi. Abajo, algo vuelve a dormirse.`,"eventos.sistema_falla.continuar.exito":`Ding. Error. Error. Reinicio completado. Compensación por las molestias entregada.`,"errores.sinRecursos":`No alcanzan los recursos. Espera a reunirlos o produce más.`,"errores.excedeTope":`Ese costo supera el tope del almacén. Amplía el almacén para poder pagarlo.`,"errores.sinPuestos":`No quedan puestos libres en ese oficio. Construye edificios que los abran.`,"errores.sinTrabajadores":`No quedan habitantes sin ocupar. Libera a alguien de otro oficio.`,"errores.sinPlano":`Falta el plano de este edificio. Búscalo en el botín de las cacerías.`,"errores.requisito":`No se cumple el requisito. Revisa lo que pide y vuelve a intentarlo.`,"errores.unica":`Solo puede haber uno. Ya lo tienes o está en obra.`,"errores.maximo":`Ya llegaste al máximo. No se puede ampliar más.`,"errores.responderEvento.requisito":`No queda techo libre en el valle.`,"errores.noDisponible":`Eso no está disponible ahora. Espera a que cambie la situación.`,"errores.pendiente":`Hay una decisión pendiente. Resuélvela antes de seguir.`,"errores.terminado":`La crónica ya terminó. Empieza una partida nueva.`,"errores.asignar.requisito":`La cantidad no es válida. Escribe un número entero desde 0.`,"errores.reservaPe.requisito":`La reserva no es válida. Indica una cantidad de piedras espirituales o quita la reserva.`,"recursos.comida":`Comida`,"recursos.madera":`Madera`,"recursos.piedra":`Piedra`,"recursos.pe":`Piedras espirituales`,"oficios.campesino":`Campesino`,"oficios.lenador":`Leñador`,"oficios.cantero":`Cantero`,"oficios.minero":`Minero`,"oficios.tropa":`Tropa`,"sucesos.inicio":`【Sistema】Ding. Anfitrión registrado. Comienza la crónica.`,"sucesos.aviso":`【Sistema】Aviso del Sistema.`,"sucesos.fin":`【Sistema】Ding. {etapa}. La crónica del valle concluye.`,"sucesos.fin.hambre":`【Sistema】El hambre vació el valle: solo queda un habitante y el feudo cae. La crónica concluye.`,"sucesos.fin.marea":`【Sistema】La marea de bestias dejó un solo habitante y el feudo cae. La crónica concluye.`,"sucesos.hambre":`No hay comida: el hambre ronda el valle.`,"sucesos.hambre.avisa":`Se acabó la comida y el valle empieza a pasar hambre.`,"sucesos.hambre.muere":`El hambre se lleva a un habitante del valle.`,"sucesos.mision":`【Sistema】Misión: «{titulo}».`,"sucesos.mision.abierta":`【Sistema】Misión disponible: «{titulo}».`,"sucesos.mision.ofrecida":`【Sistema】Misión disponible: «{titulo}».`,"sucesos.mision.aceptada":`【Sistema】Misión aceptada: «{titulo}».`,"sucesos.mision.rechazada":`【Sistema】Misión rechazada: «{titulo}».`,"sucesos.mision.retirada":`【Sistema】Misión retirada: «{titulo}».`,"sucesos.mision.cumplida":`【Sistema】Ding. Misión completada: «{titulo}».`,"sucesos.mision.fallida":`【Sistema】Misión fallida: «{titulo}».`,"sucesos.consejo":`{texto}`,"sucesos.evento":`{titulo}.`,"sucesos.evento.abierto":`Llega un asunto al valle: {titulo}.`,"sucesos.evento.resuelto":`Se resuelve el asunto: {titulo}.`,"sucesos.marea":`Marea ene los méritos que pide, o ya ascendió.`,"misiones.primer_aliento.contexto":`Un valle sin cultivo es solo tierra. El Sistema te pide que respires el Qi por primera vez, aunque el aliento sea corto.`,"misiones.rugidos.contexto":`Algo ruge entre los árboles al caer la noche. La gente duerme con un ojo abierto y espera que el valle tenga con qué defenderse.`,"misiones.primera_marea.contexto":`Cada cierto tiempo la tierra se agita y las bestias bajan en oleada. La primera marea dirá si el valle merece quedarse.`,"misiones.treinta_familias.contexto":`Treinta hogares hacen un pueblo. Ya no basta con sobrevivir: hay que dar sitio a quien llega.`,"misiones.novena_capa.contexto":`La novena capa es el umbral del Refinamiento de Qi. Quien lo cruza deja de ser un aprendiz.`,"misiones.fundacion.contexto":`Levantar la Fundación vuelve el Qi disperso un cimiento propio. Es el primer paso real hacia el Dao.`,"misiones.valle_prospera.contexto":`Un valle que prospera atrae miradas, para bien y para mal. Tanta gente bajo tu techo es una promesa que hay que sostener.`,"misiones.cumbre.contexto":`En la cima de la Fundación el camino se estrecha. Pocos llegan y menos aún siguen sin mirar atrás.`,"misiones.nucleo.contexto":`Lo que el valle y tú han reunido cabe por fin en una sola esfera dorada.`,"misiones.familias.contexto":`Corre la voz de que en tu valle hay sopa caliente. Algunas familias ya vienen por el camino.`,"misiones.veta.contexto":`Los mineros golpean la roca y suena distinto: hay Qi dentro. Unas manos más podrían sacarlo.`,"misiones.muro.contexto":`Las palizadas viejas no detendrán lo que viene. Más troncos, más altos, y que cierren bien.`,"misiones.desafio_capa.contexto":`El Sistema te reta a ir más allá de lo que crees poder. Si el plazo se agota sin que subas de capa, tu cuerpo lo pagará con una lesión.`,"misiones.graneros.contexto":`Un mal invierno vacía hasta los mejores almacenes. Mejor llenarlos antes de que la nieve decida.`,"misiones.desafio_marea.contexto":`El Sistema apuesta a que resistirás la próxima marea. Si el valle cae, se llevará parte de lo que guardas.`,"ui.misiones.historial":`Historial`,"ui.misiones.historialVacio":`Aún no has cerrado ninguna misión.`,"ui.misiones.historialFila":`{resultado} · {fecha}`,"ui.misiones.resultado.cumplida":`Cumplida`,"ui.misiones.resultado.fallida":`Fallida`,"ui.misiones.resultado.retirada":`Retirada`,"ui.misiones.resultado.rechazada":`Rechazada`,"ui.talentos.fichaVer":`Ver ficha`,"ui.talentos.fichaVerNombre":`Ver ficha de {talento}`,"ui.talentos.fichaOcultar":`Ocultar ficha`,"ui.talentos.fichaOcultarNombre":`Ocultar ficha de {talento}`,"ui.talentos.fichaNombre":`Ficha de {talento}`,"ui.talentos.fichaNace":`Nace en el grado {grado}`,"ui.talentos.fichaAhora":`Grado actual: {grado}`,"ui.talentos.fichaGrados":`Grados`,"ui.talentos.fichaActual":`Actual`,"ui.talentos.fichaSiguiente":`Siguiente`,"ui.talentos.fichaBifurcacion":`Bifurcación en el grado {grado}`,"ui.talentos.fichaBifFutura":`Se elige al llegar a ese grado. Solo una rama se queda.`,"ui.talentos.fichaBifPendiente":`Aún no has elegido: el Sistema te lo pedirá.`,"ui.talentos.fichaElegida":`Elegida`,"ui.talentos.fichaNoRevelado":`Aún no revelado`,"ui.guia.nombre":`El Sistema`,"ui.guia.quien":`EL SISTEMA`,"ui.guia.paso":`Paso {n} de {m}`,"ui.guia.saltar":`Saltar guía`,"ui.guia.entendido":`Entendido`,"ui.seccion.codice":`Códice`,"ui.codice.ayuda":`Lo que el Sistema sabe del valle, para consultarlo cuando quieras.`,"ui.codice.pestanas":`Apartados del Códice`,"ui.codice.tab.recursos":`Recursos`,"ui.codice.tab.edificios":`Edificios`,"ui.codice.tab.talentos":`Talentos`,"ui.codice.tab.mareas":`Mareas`,"ui.codice.origen":`De dónde sale`,"ui.codice.uso":`Para qué sirve`,"ui.codice.tope":`Tope actual`,"ui.codice.recurso.comida.origen":`Sobre todo la cultivan los campesinos en los campos: {tasa} al día cada uno, de base y según la estación. Quien no tiene trabajo aporta {ocioso} al día.`,"ui.codice.recurso.comida.uso":`Cada habitante come {con
